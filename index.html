<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Traffic: Пробки и Эко-мониторинг Алматы</title>
    <!-- Подключаем стили Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        header {
            height: 50px;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #334155;
            position: relative;
            z-index: 1000;
        }
        h1 {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
        }
        .status-badge {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 50px);
            position: relative;
        }
        /* Адаптивная боковая панель */
        aside {
            width: 320px;
            max-width: 85vw;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(5px);
            border-right: 1px solid #334155;
            padding: 15px;
            overflow-y: auto;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        aside h2 {
            font-size: 0.9rem;
            color: #f8fafc;
        }
        .control-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .eco-toggle-btn {
            background-color: #10b981;
            color: white;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .search-box input {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 4px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .road-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .road-title {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 3px;
        }
        .road-info {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .tag-red { color: #ef4444; font-weight: bold; }
        .tag-yellow { color: #eab308; font-weight: bold; }
        .tag-green { color: #10b981; font-weight: bold; }

        /* Кнопка скрыть/показать панель на мобильных */
        .toggle-panel-btn {
            position: absolute;
            top: 10px;
            left: 330px;
            z-index: 1000;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 0.8rem;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Класс для скрытия панели */
        aside.hidden {
            transform: translateX(-100%);
        }
    </style>
</head>
<body>

    <header>
        <h1>Q-Traffic & Eco</h1>
        <div class="status-badge">Эко-индекс: Угроза смога</div>
    </header>

    <div class="main-container">
        <!-- Кнопка сворачивания панели -->
        <button class="toggle-panel-btn" id="toggleBtn" onclick="togglePanel()">☰ Меню</button>

        <aside id="sidebar">
            <button class="control-btn" onclick="locateUser()">📍 Мое местоположение</button>
            <button class="control-btn eco-toggle-btn" onclick="toggleEcoZones()">🍃 Зоны воздуха</button>

            <div class="search-box">
                <h2>Куда поехать?</h2>
                <input type="text" id="destination-input" placeholder="Например: Медеу, Коктобе">
                <button class="control-btn" style="background-color: #22c55e; color: white;" onclick="searchDestination()">Найти путь</button>
            </div>

            <h2>Экология по районам</h2>
            
            <div class="road-card" onclick="focusRoad(43.2245, 76.9300, 14)">
                <div class="road-title">Проспект Аль-Фараби</div>
                <div class="road-info"><span>Выбросы PM2.5</span><span class="tag-red">Опасно</span></div>
            </div>

            <div class="road-card" onclick="focusRoad(43.2390, 76.9250, 14)">
                <div class="road-title">Проспект Абая</div>
                <div class="road-info"><span>Умеренный смог</span><span class="tag-yellow">Средне</span></div>
            </div>

            <div class="road-card" onclick="focusRoad(43.1575, 77.0593, 13)">
                <div class="road-title">Район Медеу</div>
                <div class="road-info"><span>Чистый воздух</span><span class="tag-green">Отлично</span></div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <!-- Подключаем скрипт Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([43.238293, 76.945465], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let userMarker = null;
        let routeLine = null;
        let ecoLayerGroup = L.layerGroup();
        let ecoVisible = true;

        function focusRoad(lat, lon, zoom) {
            map.setView([lat, lon], zoom);
            if(window.innerWidth < 768) togglePanel(); // Автоматически скрывать меню на телефоне при клике
        }

        function togglePanel() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleBtn');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                toggleBtn.style.left = '10px';
            } else {
                toggleBtn.style.left = sidebar.offsetWidth + 'px';
            }
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // Эко-зоны
        const redEcoZone = L.circle([43.2230, 76.9200], { color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.3, radius: 2500 }).bindPopup('Высокое загрязнение PM2.5');
        const yellowEcoZone = L.circle([43.2390, 76.9250], { color: '#eab308', fillColor: '#eab308', fillOpacity: 0.25, radius: 2000 }).bindPopup('Умеренный смог');
        const greenEcoZone = L.circle([43.1800, 76.9800], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.3, radius: 3000 }).bindPopup('Чистый воздух');

        ecoLayerGroup.addLayer(redEcoZone);
        ecoLayerGroup.addLayer(yellowEcoZone);
        ecoLayerGroup.addLayer(greenEcoZone);
        ecoLayerGroup.addTo(map);

        function toggleEcoZones() {
            if (ecoVisible) {
                map.removeLayer(ecoLayerGroup);
                ecoVisible = false;
            } else {
                ecoLayerGroup.addTo(map);
                ecoVisible = true;
            }
        }

        function locateUser() {
            if (!navigator.geolocation) return alert('Не поддерживается');
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([lat, lon]).addTo(map).bindPopup('Вы здесь').openPopup();
                map.setView([lat, lon], 15);
                if(window.innerWidth < 768) togglePanel();
            });
        }

        function searchDestination() {
            const query = document.getElementById('destination-input').value.trim().toLowerCase();
            if (!query) return alert('Введите место!');
            const places = {
                'медеу': [43.1575, 77.0593],
                'коктобе': [43.2303, 76.9744],
                'вокзал алматы-1': [43.3361, 76.9383],
                'вокзал алматы-2': [43.2683, 76.9419],
                'mega almaty': [43.2227, 76.9061]
            };
            let destCoords = places[query] || [43.2382, 76.9454];

            L.marker(destCoords).addTo(map).bindPopup(query).openPopup();

            if (userMarker) {
                const userLatLng = userMarker.getLatLng();
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline([[userLatLng.lat, userLatLng.lng], destCoords], { color: '#10b981', weight: 6, dashArray: '5, 10' }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
            } else {
                map.setView(destCoords, 14);
            }
            if(window.innerWidth < 768) togglePanel();
        }

        L.polyline([[43.2215, 76.9050], [43.2260, 76.9400], [43.2280, 76.9550]], { color: '#ef4444', weight: 5 }).addTo(map);
        L.polyline([[43.2420, 76.9000], [43.2390, 76.9250], [43.2360, 76.9500]], { color: '#eab308', weight: 5 }).addTo(map);
    </script>
</body>
</html>
