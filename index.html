<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Traffic: Пробки и Эко-мониторинг Алматы</title>
    <!-- Подключаем стили Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 60px;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            position: relative;
        }
        aside {
            width: 340px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            padding: 20px;
            overflow-y: auto;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        aside h2 {
            font-size: 1rem;
            color: #f8fafc;
        }
        .control-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-align: center;
        }
        .control-btn:hover {
            background-color: #0ea5e9;
        }
        .eco-toggle-btn {
            background-color: #10b981;
            color: white;
        }
        .eco-toggle-btn:hover {
            background-color: #059669;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .search-box input {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        .road-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .road-card:hover {
            border-color: #38bdf8;
        }
        .road-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        .road-info {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .tag-red { color: #ef4444; font-weight: bold; }
        .tag-yellow { color: #eab308; font-weight: bold; }
        .tag-green { color: #10b981; font-weight: bold; }
        #map {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Q-Traffic & Eco: Алматы</h1>
        <div class="header-right">
            <div id="general-score" class="status-badge">Эко-индекс: Угроза смога</div>
        </div>
    </header>

    <div class="main-container">
        <aside>
            <!-- Кнопка геолокации -->
            <button class="control-btn" onclick="locateUser()">📍 Мое местоположение</button>

            <!-- Кнопка переключения зон чистого воздуха -->
            <button class="control-btn eco-toggle-btn" onclick="toggleEcoZones()">🍃 Показать / Скрыть зоны воздуха</button>

            <!-- Блок поиска маршрута -->
            <div class="search-box">
                <h2>Куда поехать?</h2>
                <input type="text" id="destination-input" placeholder="Введите место (например: Медеу, Коктобе)">
                <button class="control-btn" style="background-color: #22c55e; color: white;" onclick="searchDestination()">Найти путь</button>
            </div>

            <h2>Экология по районам</h2>
            
            <div class="road-card" onclick="focusRoad(43.2245, 76.9300, 14)">
                <div class="road-title">Проспект Аль-Фараби</div>
                <div class="road-info"><span>Выбросы PM2.5 (Высокие)</span><span class="tag-red">Опасно</span></div>
            </div>

            <div class="road-card" onclick="focusRoad(43.2390, 76.9250, 14)">
                <div class="road-title">Проспект Абая</div>
                <div class="road-info"><span>Умеренный смог</span><span class="tag-yellow">Средне</span></div>
            </div>

            <div class="road-card" onclick="focusRoad(43.1575, 77.0593, 13)">
                <div class="road-title">Район Медеу / Предгорья</div>
                <div class="road-info"><span>Чистый горный воздух</span><span class="tag-green">Отлично</span></div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <!-- Подключаем скрипт Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты с центром на Алматы
        const map = L.map('map').setView([43.238293, 76.945465], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let userMarker = null;
        let routeLine = null;
        let ecoLayerGroup = L.layerGroup(); // Группа для зон чистого воздуха
        let ecoVisible = true;

        function focusRoad(lat, lon, zoom) {
            map.setView([lat, lon], zoom);
        }

        // --- СОЗДАЕМ ЗОНЫ ЧИСТОГО ВОЗДУХА (Круги загрязнения/чистоты) ---
        // Красная зона (сильное загрязнение на Аль-Фараби / Саина)
        const redEcoZone = L.circle([43.2230, 76.9200], {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.3,
            radius: 2500
        }).bindPopup('<b>Зона высокого загрязнения воздуха (PM2.5)</b><br>Причина: плотный транспортный затор.');

        // Желтая зона (среднее загрязнение в центре / Абая)
        const yellowEcoZone = L.circle([43.2390, 76.9250], {
            color: '#eab308',
            fillColor: '#eab308',
            fillOpacity: 0.25,
            radius: 2000
        }).bindPopup('<b>Умеренная зона смога</b><br>Рекомендуется закрывать окна в авто.');

        // Зеленая зона (чистый воздух в предгорьях / Медеу)
        const greenEcoZone = L.circle([43.1800, 76.9800], {
            color: '#10b981',
            fillColor: '#10b981',
            fillOpacity: 0.3,
            radius: 3000
        }).bindPopup('<b>Зона чистой экологии</b><br>Свежий горный поток с гор.');

        // Добавляем зоны в эко-слой и на карту по умолчанию
        ecoLayerGroup.addLayer(redEcoZone);
        ecoLayerGroup.addLayer(yellowEcoZone);
        ecoLayerGroup.addLayer(greenEcoZone);
        ecoLayerGroup.addTo(map);

        // Функция переключения видимости эко-зон
        function toggleEcoZones() {
            if (ecoVisible) {
                map.removeLayer(ecoLayerGroup);
                ecoVisible = false;
                alert('Эко-зоны скрыты');
            } else {
                ecoLayerGroup.addTo(map);
                ecoVisible = true;
                alert('Эко-зоны отображены на карте');
            }
        }

        // Геолокация пользователя
        function locateUser() {
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([lat, lon]).addTo(map).bindPopup('<b>Вы здесь</b>').openPopup();
                map.setView([lat, lon], 15);
            }, () => {
                alert('Не удалось определить местоположение');
            });
        }

        // Поиск направления
        function searchDestination() {
            const query = document.getElementById('destination-input').value.trim().toLowerCase();
            if (!query) {
                alert('Введите место!');
                return;
            }
            const places = {
                'медеу': [43.1575, 77.0593],
                'коктобе': [43.2303, 76.9744],
                'вокзал алматы-1': [43.3361, 76.9383],
                'вокзал алматы-2': [43.2683, 76.9419],
                'mega almaty': [43.2227, 76.9061]
            };
            let destCoords = places[query] || [43.2382, 76.9454];

            L.marker(destCoords).addTo(map).bindPopup(`<b>Путь к:</b> ${query}`).openPopup();

            if (userMarker) {
                const userLatLng = userMarker.getLatLng();
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline([[userLatLng.lat, userLatLng.lng], destCoords], { color: '#10b981', weight: 6, dashArray: '5, 10' }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
            } else {
                map.setView(destCoords, 14);
            }
        }

        // Базовые линии пробок
        L.polyline([[43.2215, 76.9050], [43.2260, 76.9400], [43.2280, 76.9550]], { color: '#ef4444', weight: 5 }).addTo(map).bindPopup('Проспект Аль-Фараби (пробка)');
        L.polyline([[43.2420, 76.9000], [43.2390, 76.9250], [43.2360, 76.9500]], { color: '#eab308', weight: 5 }).addTo(map).bindPopup('Проспект Абая');
    </script>
</body>
</html>
