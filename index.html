<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Traffic & Eco | Алматы</title>
    <!-- Подключаем стили Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
        }
        header {
            height: 48px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1000;
        }
        .logo {
            font-size: 0.9rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .eco-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 48px);
            position: relative;
        }
        aside {
            width: 290px;
            max-width: 80vw;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            overflow-y: auto;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        aside.hidden {
            transform: translateX(-100%);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 600;
        }
        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .close-btn:hover {
            color: white;
            background: rgba(255,255,255,0.1);
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
        }
        .btn-eco {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }
        .search-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .search-card input {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 8px;
            border-radius: 6px;
            color: white;
            font-size: 0.8rem;
            outline: none;
        }
        .card-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-item:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .card-title {
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 2px;
            color: #f8fafc;
        }
        .card-info {
            font-size: 0.65rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .tag-red { color: #ef4444; font-weight: 600; }
        .tag-yellow { color: #f59e0b; font-weight: 600; }
        .tag-green { color: #10b981; font-weight: 600; }

        .menu-toggle {
            position: absolute;
            top: 8px;
            left: 300px;
            z-index: 1000;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 8px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .leaflet-popup-tip { background: #1e293b; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Q-Traffic & Eco</div>
        <div id="eco-status-badge" class="eco-badge">Загрузка API...</div>
    </header>

    <div class="main-container">
        <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">✕ Меню</button>

        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="section-title">Управление</span>
                <button class="close-btn" onclick="toggleSidebar()">✕</button>
            </div>

            <button class="btn" onclick="locateUser()">📍 Мое местоположение</button>
            <button class="btn btn-eco" onclick="toggleEcoZones()">🍃 Зоны чистого воздуха</button>

            <div class="search-card">
                <span class="section-title">Поиск объекта / улицы</span>
                <input type="text" id="searchInput" placeholder="Например: москва, медеу...">
                <button class="btn" style="padding: 5px; font-size: 0.75rem;" onclick="searchLocation()">Найти</button>
            </div>

            <div>
                <span class="section-title" style="display: block; margin-bottom: 4px;">Магистрали</span>
                
                <div class="card-item" onclick="focusRoad(43.2245, 76.9300, 14)">
                    <div class="card-title">Аль-Фараби</div>
                    <div class="card-info"><span>PM2.5</span><span class="tag-red">Опасно</span></div>
                </div>

                <div class="card-item" onclick="focusRoad(43.2390, 76.9250, 14)">
                    <div class="card-title">Проспект Абая</div>
                    <div class="card-info"><span>Трафик</span><span class="tag-yellow">Средне</span></div>
                </div>

                <div class="card-item" onclick="focusRoad(43.1575, 77.0593, 13)">
                    <div class="card-title">Район Медеу</div>
                    <div class="card-info"><span>Предгорья</span><span class="tag-green">Чисто</span></div>
                </div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <!-- Подключаем скрипт Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([43.238293, 76.945465], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let userMarker = null;
        let searchMarker = null;
        let routeLine = null;
        let ecoGroup = L.layerGroup();
        let ecoVisible = true;

        const database = {
            'москва': [43.2354, 76.8725],
            'медеу': [43.1575, 77.0593],
            'коктобе': [43.2303, 76.9744],
            'абая': [43.2390, 76.9250],
            'аль-фараби': [43.2245, 76.9300],
            'вокзал алматы-1': [43.3361, 76.9383],
            'вокзал алматы-2': [43.2683, 76.9419],
            'mega': [43.2227, 76.9061],
            'достык': [43.2550, 76.9450]
        };

        // Запрос реальных данных качества воздуха через WAQI API
        async function fetchRealAirQuality() {
            try {
                const response = await fetch('https://api.waqi.info/feed/almaty/?token=demo');
                const data = await response.json();
                
                if (data.status === 'ok') {
                    const aqi = data.data.aqi;
                    const badge = document.getElementById('eco-status-badge');
                    badge.innerText = `AQI (Алматы): ${aqi}`;
                    
                    if (aqi > 100) {
                        badge.style.color = '#ef4444';
                        badge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                        badge.style.background = 'rgba(239, 68, 68, 0.15)';
                    } else if (aqi > 50) {
                        badge.style.color = '#f59e0b';
                        badge.style.borderColor = 'rgba(245, 158, 11, 0.3)';
                        badge.style.background = 'rgba(245, 158, 11, 0.15)';
                    } else {
                        badge.style.color = '#10b981';
                        badge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                        badge.style.background = 'rgba(16, 185, 129, 0.15)';
                    }
                }
            } catch (error) {
                document.getElementById('eco-status-badge').innerText = 'Эко-API оффлайн';
            }
        }

        fetchRealAirQuality();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menuToggle');
            sidebar.classList.toggle('hidden');
            
            if (sidebar.classList.contains('hidden')) {
                toggleBtn.style.left = '10px';
                toggleBtn.innerHTML = '☰ Меню';
            } else {
                toggleBtn.style.left = (sidebar.offsetWidth + 10) + 'px';
                toggleBtn.innerHTML = '✕ Меню';
            }
            setTimeout(() => map.invalidateSize(), 300);
        }

        function focusRoad(lat, lon, zoom) {
            map.setView([lat, lon], zoom);
            if(window.innerWidth < 768) toggleSidebar();
        }

        const redZone = L.circle([43.2230, 76.9200], { color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.3, radius: 2500 }).bindPopup('Высокий смог');
        const yellowZone = L.circle([43.2390, 76.9250], { color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.25, radius: 2000 }).bindPopup('Умеренное загрязнение');
        const greenZone = L.circle([43.1800, 76.9800], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.3, radius: 3000 }).bindPopup('Чистый воздух');
        
        ecoGroup.addLayer(redZone);
        ecoGroup.addLayer(yellowZone);
        ecoGroup.addLayer(greenZone);
        ecoGroup.addTo(map);

        function toggleEcoZones() {
            if (ecoVisible) {
                map.removeLayer(ecoGroup);
                ecoVisible = false;
            } else {
                ecoGroup.addTo(map);
                ecoVisible = true;
            }
        }

        function locateUser() {
            if (!navigator.geolocation) return alert('Геолокация не поддерживается');
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([lat, lon]).addTo(map).bindPopup('<b>Вы здесь</b>').openPopup();
                map.setView([lat, lon], 15);
                if(window.innerWidth < 768) toggleSidebar();
            }, () => {
                alert('Не удалось определить координаты');
            });
        }

        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return alert('Введите место!');

            let coords = null;
            for (let key in database) {
                if (query.includes(key)) {
                    coords = database[key];
                    break;
                }
            }

            if (!coords) {
                alert('Место не найдено. Попробуйте: москва, медеу, коктобе, абая');
                return;
            }

            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker(coords).addTo(map).bindPopup(`<b>Найдено:</b> ${query.toUpperCase()}`).openPopup();
            
            map.setView(coords, 15);

            if (userMarker) {
                const userLatLng = userMarker.getLatLng();
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline([[userLatLng.lat, userLatLng.lng], coords], { color: '#38bdf8', weight: 5, dashArray: '6, 8' }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
            }

            if(window.innerWidth < 768) toggleSidebar();
        }

        L.polyline([[43.2215, 76.9050], [43.2260, 76.9400], [43.2280, 76.9550]], { color: '#ef4444', weight: 4, opacity: 0.8 }).addTo(map);
        L.polyline([[43.2420, 76.9000], [43.2390, 76.9250], [43.2360, 76.9500]], { color: '#f59e0b', weight: 4, opacity: 0.8 }).addTo(map);
    </script>
</body>
</html>
