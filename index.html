<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Traffic & Eco | Алматы</title>
    <!-- Подключаем стили Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
        }
        header {
            height: 55px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1000;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .eco-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 55px);
            position: relative;
        }
        /* Стильная боковая панель */
        aside {
            width: 360px;
            max-width: 90vw;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            overflow-y: auto;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        aside.hidden {
            transform: translateX(-100%);
        }
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            padding: 11px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
        }
        .btn-eco {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .search-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-card input {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-card input:focus {
            border-color: #38bdf8;
        }
        .card-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-item:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(2px);
        }
        .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .card-info {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .tag-red { color: #ef4444; font-weight: 600; }
        .tag-yellow { color: #f59e0b; font-weight: 600; }
        .tag-green { color: #10b981; font-weight: 600; }

        /* Кнопка вызова меню */
        .menu-toggle {
            position: absolute;
            top: 12px;
            left: 375px;
            z-index: 1000;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Кастомные стили попапов на карте */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Q-Traffic & Eco</div>
        <div class="eco-badge">⚠ Индекс смога: Высокий</div>
    </header>

    <div class="main-container">
        <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">✕ Меню</button>

        <aside id="sidebar">
            <button class="btn" onclick="locateUser()">📍 Мое местоположение</button>
            <button class="btn btn-eco" onclick="toggleEcoZones()">🍃 Зоны чистого воздуха</button>

            <div class="search-card">
                <div class="section-title">Поиск объекта / улицы</div>
                <input type="text" id="searchInput" placeholder="Например: москва, медеу, абая...">
                <button class="btn" style="padding: 8px; font-size: 0.85rem;" onclick="searchLocation()">Найти на карте</button>
            </div>

            <div>
                <div class="section-title" style="margin-bottom: 8px;">Мониторинг магистралей</div>
                
                <div class="card-item" onclick="focusRoad(43.2245, 76.9300, 14, 'Проспект Аль-Фараби')">
                    <div class="card-title">Проспект Аль-Фараби</div>
                    <div class="card-info"><span>Выбросы PM2.5</span><span class="tag-red">Опасно</span></div>
                </div>

                <div class="card-item" onclick="focusRoad(43.2390, 76.9250, 14, 'Проспект Абая')">
                    <div class="card-title">Проспект Абая</div>
                    <div class="card-info"><span>Плотный трафик</span><span class="tag-yellow">Средне</span></div>
                </div>

                <div class="card-item" onclick="focusRoad(43.1575, 77.0593, 13, 'Район Медеу')">
                    <div class="card-title">Район Медеу</div>
                    <div class="card-info"><span>Предгорья</span><span class="tag-green">Чисто</span></div>
                </div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <!-- Подключаем скрипт Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([43.238293, 76.945465], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Используем чистую темную тему тайлов без ключей (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        let userMarker = null;
        let searchMarker = null;
        let routeLine = null;
        let ecoGroup = L.layerGroup();
        let ecoVisible = true;

        // База данных координат для точного поиска
        const database = {
            'москва': [43.2354, 76.8725], // Станция метро Москва / ТРЦ Moskva
            'медеу': [43.1575, 77.0593],
            'коктобе': [43.2303, 76.9744],
            'абая': [43.2390, 76.9250],
            'аль-фараби': [43.2245, 76.9300],
            'вокзал алматы-1': [43.3361, 76.9383],
            'вокзал алматы-2': [43.2683, 76.9419],
            'mega': [43.2227, 76.9061],
            'достык': [43.2550, 76.9450]
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('menuToggle');
            sidebar.classList.toggle('hidden');
            
            if (sidebar.classList.contains('hidden')) {
                toggleBtn.style.left = '15px';
                toggleBtn.innerHTML = '☰ Меню';
            } else {
                toggleBtn.style.left = (sidebar.offsetWidth + 15) + 'px';
                toggleBtn.innerHTML = '✕ Меню';
            }
            setTimeout(() => map.invalidateSize(), 300);
        }

        function focusRoad(lat, lon, zoom, name) {
            map.setView([lat, lon], zoom);
            if(window.innerWidth < 768) toggleSidebar();
        }

        // Эко-зоны на карте
        const redZone = L.circle([43.2230, 76.9200], { color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.25, radius: 2500 }).bindPopup('<b>Зона высокого смога</b><br>Высокая концентрация выхлопных газов.');
        const yellowZone = L.circle([43.2390, 76.9250], { color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.2, radius: 2000 }).bindPopup('<b>Умеренное загрязнение</b>');
        const greenZone = L.circle([43.1800, 76.9800], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.25, radius: 3000 }).bindPopup('<b>Чистый воздух (Предгорья)</b>');
        
        ecoGroup.addLayer(redZone);
        ecoGroup.addLayer(yellowZone);
        ecoGroup.addLayer(greenZone);
        ecoGroup.addTo(map);

        function toggleEcoZones() {
            if (ecoVisible) {
                map.removeLayer(ecoGroup);
                ecoVisible = false;
            } else {
                ecoGroup.addTo(map);
                ecoVisible = true;
            }
        }

        function locateUser() {
            if (!navigator.geolocation) return alert('Геолокация не поддерживается');
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([lat, lon]).addTo(map).bindPopup('<b>Вы здесь</b>').openPopup();
                map.setView([lat, lon], 15);
                if(window.innerWidth < 768) toggleSidebar();
            }, () => {
                alert('Не удалось определить координаты');
            });
        }

        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return alert('Введите название места!');

            let coords = null;
            // Ищем точное или частичное совпадение в нашей базе
            for (let key in database) {
                if (query.includes(key)) {
                    coords = database[key];
                    break;
                }
            }

            if (!coords) {
                alert('Место не найдено в базе. Попробуйте: москва, медеу, коктобе, абая');
                return;
            }

            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker(coords).addTo(map).bindPopup(`<b>Найдено:</b> ${query.toUpperCase()}`).openPopup();
            
            map.setView(coords, 15);

            // Если есть геолокация, чертим эко-маршрут
            if (userMarker) {
                const userLatLng = userMarker.getLatLng();
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline([[userLatLng.lat, userLatLng.lng], coords], { color: '#38bdf8', weight: 5, dashArray: '6, 8' }).addTo(map);
                map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
            }

            if(window.innerWidth < 768) toggleSidebar();
        }

        // Отрисовка линий пробок на дорогах
        L.polyline([[43.2215, 76.9050], [43.2260, 76.9400], [43.2280, 76.9550]], { color: '#ef4444', weight: 4, opacity: 0.8 }).addTo(map).bindPopup('Аль-Фараби (Затор)');
        L.polyline([[43.2420, 76.9000], [43.2390, 76.9250], [43.2360, 76.9500]], { color: '#f59e0b', weight: 4, opacity: 0.8 }).addTo(map).bindPopup('Абая (Плотный поток)');
    </script>
</body>
</html>
